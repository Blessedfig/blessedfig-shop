<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A neutral guide for parents of every background: what each English-licensed manga holds up as a good life, graded S to F from your own tradition's view.">
<link rel="canonical" href="https://www.theblessedfigtree.com/manga-guide/">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Manga Worldview Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Karla:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a calm family bookshelf. Sticky masthead, a picker sentence as the hero, results as a graded list (grade tile left, reasons right). */
:root{
  --paper:#faf4e8;--panel:#fffdf8;--ink:#2b2118;--muted:#6f6052;--rule:#eadcc6;--accent:#2f6a4c;--accent-soft:#e5efe1;--tone:#e8dcc8;--warm:#b5761c;--warm-soft:#f8ecd2;--fig:#6d3a5f;--shadow:0 1px 2px rgba(74,48,20,.06),0 4px 14px rgba(74,48,20,.08);
  --gS:#8a6a00; --gS-bg:#fbf1cf; --gA:#22704a; --gA-bg:#dff2e6; --gB:#1f6378; --gB-bg:#ddeef3;
  --gC:#8a5a00; --gC-bg:#f8ead0; --gD:#a4461b; --gD-bg:#f8e1d5; --gF:#a3262d; --gF-bg:#f6dadb; --gN:#6f6052; --gN-bg:#efe6d8;
  --f-display:"Young Serif",Georgia,"Times New Roman",serif;
  --f-body:"Karla","Segoe UI",system-ui,sans-serif;
  --f-mono:"Karla","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#1b1611;--panel:#251e17;--ink:#f1e8da;--muted:#b8a892;--rule:#3a2f24;--accent:#8fcca8;--accent-soft:#1f3326;--tone:#3a3026;--warm:#e6b35c;--warm-soft:#3a2c14;--fig:#d9a3c9;--shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  --gS:#f0cb5a;--gS-bg:#3a3110;--gA:#73d39f;--gA-bg:#163325;--gB:#7cc4d0;--gB-bg:#17313a;--gC:#e8b660;--gC-bg:#382a12;--gD:#f0946a;--gD-bg:#3b2117;--gF:#f2858b;--gF-bg:#3b1a1d;--gN:#b8a892;--gN-bg:#2e261e;}}
:root[data-theme="dark"]{--paper:#1b1611;--panel:#251e17;--ink:#f1e8da;--muted:#b8a892;--rule:#3a2f24;--accent:#8fcca8;--accent-soft:#1f3326;--tone:#3a3026;--warm:#e6b35c;--warm-soft:#3a2c14;--fig:#d9a3c9;--shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  --gS:#f0cb5a;--gS-bg:#3a3110;--gA:#73d39f;--gA-bg:#163325;--gB:#7cc4d0;--gB-bg:#17313a;--gC:#e8b660;--gC-bg:#382a12;--gD:#f0946a;--gD-bg:#3b2117;--gF:#f2858b;--gF-bg:#3b1a1d;--gN:#b8a892;--gN-bg:#2e261e;}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:17px/1.55 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.wrap{max-width:1060px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.mast{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--rule)}
.mast .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 24px;padding-block:10px}
.brand{font:900 1.2rem/1.1 var(--f-display);color:var(--ink);text-decoration:none;display:flex;gap:10px;align-items:baseline}
.brand small{font:500 .7rem var(--f-mono);color:var(--muted);letter-spacing:.06em}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap}
nav.tabs a{font:600 .95rem var(--f-body);color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:6px}
nav.tabs a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:28px 64px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-size:clamp(1.8rem,4.6vw,2.7rem);font-weight:900;line-height:1.12}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1.02rem;font-weight:700}
p{margin:0}
.lede{color:var(--muted);max-width:62ch;font-size:1.05rem}
.eyebrow{font:500 .72rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.note{font-size:.92rem;color:var(--muted);max-width:70ch}
.note a,.lede a{color:var(--accent)}
/* hero picker */
.hero{display:flex;flex-direction:column;gap:16px;padding-block:4px 8px}
.iam{font:900 clamp(1.6rem,4.6vw,2.6rem)/1.2 var(--f-display);display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.iam select{font:900 clamp(1.2rem,3.8vw,1.9rem) var(--f-display);color:var(--accent);background:var(--accent-soft);border:2px solid var(--accent);border-radius:10px;padding:4px 10px;max-width:100%;min-width:0}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{font:600 .92rem var(--f-body);border:1px solid var(--rule);background:var(--panel);color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer}
.pill:hover{border-color:var(--accent)}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
/* grade legend */
.legend{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.legend div{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:10px;font-size:.86rem;line-height:1.35;color:var(--muted)}
.legend b{display:block;color:var(--ink);font-weight:700}
@media (max-width:900px){.legend{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){.legend{grid-template-columns:repeat(2,minmax(0,1fr))}}
.grade{flex:none;display:inline-grid;place-items:center;width:2.2rem;height:2.2rem;border-radius:8px;font:900 1.25rem/1 var(--f-display);color:var(--gN);background:var(--gN-bg)}
.grade.lg{width:3.4rem;height:3.4rem;font-size:2rem;border-radius:12px}
.grade.sm{width:1.7rem;height:1.7rem;font-size:.95rem;border-radius:6px}
.grade.prov{outline:2px dashed currentColor;outline-offset:-4px}
.g-S{color:var(--gS);background:var(--gS-bg)} .g-A{color:var(--gA);background:var(--gA-bg)} .g-B{color:var(--gB);background:var(--gB-bg)}
.g-C{color:var(--gC);background:var(--gC-bg)} .g-D{color:var(--gD);background:var(--gD-bg)} .g-F{color:var(--gF);background:var(--gF-bg)}
/* controls */
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:end;padding:14px;background:var(--panel);border:1px solid var(--rule);border-radius:10px}
.controls label{display:flex;flex-direction:column;gap:4px;font:500 .74rem var(--f-mono);letter-spacing:.05em;color:var(--muted);text-transform:uppercase}
.controls .check{flex-direction:row;align-items:center;gap:8px;text-transform:none;font:600 .95rem var(--f-body);color:var(--ink);padding-bottom:6px}
input[type=search],select{font:400 1rem var(--f-body);color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:7px 10px;min-width:0;max-width:100%}
input[type=search]{width:min(300px,100%)}
.count{font:500 .82rem var(--f-mono);color:var(--muted)}
/* result rows */
.list{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 16px;padding:16px 6px;border-bottom:1px solid var(--rule);text-decoration:none;color:inherit;align-items:start}
.row:hover{background:var(--accent-soft)}
.row .t{font:700 1.1rem/1.25 var(--f-display)}
.row .sub{color:var(--muted);font-size:.92rem}
.row .side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:right}
.why{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px 18px;font-size:.92rem;color:var(--muted);margin-top:4px}
.why b{color:var(--ink);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{font:500 .74rem/1.3 var(--f-mono);padding:4px 7px;border-radius:4px;border:1px solid var(--rule);color:var(--muted);overflow-wrap:anywhere}
.chip.sum{border-color:var(--accent);color:var(--accent)}
.chip.db{border-style:dashed}
.intensity{font:500 .8rem var(--f-mono);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.meter{display:inline-grid;grid-template-columns:repeat(10,7px);gap:2px;vertical-align:middle;margin-right:6px}
.meter i{height:11px;background:var(--tone);border-radius:1px}
.meter i.on{background:var(--muted)}
.meter.hi i.on{background:var(--gF)} .meter.mid i.on{background:var(--gC)} .meter.lo i.on{background:var(--gA)}
.genres{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.genres button{flex:none;font:600 .9rem var(--f-body);border:none;border-bottom:2px solid transparent;background:none;color:var(--muted);padding:8px 10px;cursor:pointer;white-space:nowrap}
.genres button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.genres button .count{margin-left:4px}
.groupHead{display:flex;align-items:center;gap:12px;margin-top:8px}
.empty{color:var(--muted);padding:14px 6px}
@media (max-width:640px){.row{grid-template-columns:auto minmax(0,1fr)}.row .side{grid-column:2;align-items:flex-start;text-align:left}.why{grid-template-columns:minmax(0,1fr)}}
/* series page */
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr));gap:16px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.94rem}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font:500 .72rem var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
td.num{white-space:nowrap}
.message{font:700 1.15rem/1.45 var(--f-display);max-width:60ch;border-left:3px solid var(--accent);padding-left:14px}
.banner{border:1px dashed var(--accent);background:var(--accent-soft);border-radius:8px;padding:12px 14px;font-size:.94rem}
.verdict{display:flex;gap:16px;align-items:center;background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:16px}
.verdict select{font:600 1rem var(--f-body)}
.axis{display:grid;grid-template-columns:8rem minmax(0,1fr);gap:4px 10px;align-items:center;font-size:.9rem}
.axis .track{position:relative;height:20px;border-radius:10px;background:var(--tone)}
.axis .dot{position:absolute;top:2px;width:16px;height:16px;border-radius:50%;background:var(--accent);transform:translateX(-50%)}
.axis .ends{grid-column:2;display:flex;justify-content:space-between;font:500 .7rem var(--f-mono);color:var(--muted)}
.bars{display:grid;grid-template-columns:auto minmax(0,11rem) minmax(0,1fr) 2rem;gap:6px 10px;align-items:center;font-size:.9rem}
.bars .b{height:9px;background:var(--tone);border-radius:5px;overflow:hidden}
.bars .b span{display:block;height:100%;background:var(--accent)}
.bars .v{font:500 .8rem var(--f-mono);text-align:right}
.md{max-width:72ch}
.md h1{display:none}
.md h2{margin:28px 0 8px;padding-top:12px;border-top:1px solid var(--rule)}
.md p,.md ul,.md ol{margin:0 0 12px}
.md table{display:block;overflow-x:auto;font-size:.86rem;margin-bottom:16px}
.md a{color:var(--accent)}
details.full summary{cursor:pointer;font:700 1.05rem var(--f-display);color:var(--accent);padding:10px 0}
.back{font:600 .95rem var(--f-body);color:var(--accent);text-decoration:none}
footer{color:var(--muted);font-size:.86rem;border-top:1px solid var(--rule);padding-block:20px}
/* simple start + progressive detail */
.step{display:flex;flex-direction:column;gap:12px;background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:18px}
.step h2{display:flex;align-items:center;gap:10px;font-size:1.2rem}
.num{display:inline-grid;place-items:center;width:1.8rem;height:1.8rem;border-radius:50%;background:var(--accent);color:var(--panel);font:700 .95rem var(--f-body);flex:none}
.pills.big .pill{font-size:1.02rem;padding:11px 18px;min-height:44px}
.pill{min-height:40px}
.linkbtn{align-self:flex-start;background:none;border:0;padding:6px 0;color:var(--accent);font:600 .95rem var(--f-body);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.gbtn{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--paper);border:1.5px solid var(--rule);border-radius:12px;padding:14px;cursor:pointer;color:var(--ink);font:400 .9rem/1.35 var(--f-body)}
.gbtn strong{font:700 1.05rem var(--f-display)}
.gbtn span{color:var(--muted)}
.gbtn:hover{border-color:var(--accent)}
.gbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.choices{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:1rem}
.reshead{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.cards{display:flex;flex-direction:column;gap:8px}
.card{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:10px 12px;color:inherit;text-decoration:none}
.card:hover{border-color:var(--accent)}
.cover{width:52px;height:74px;object-fit:cover;border-radius:6px;background:var(--tone);display:block}
.cover.lg{width:84px;height:120px;flex:none}
.cbody{display:flex;flex-direction:column;gap:3px;min-width:0}
.card .t{font:700 1.05rem/1.25 var(--f-display)}
.card .sub{color:var(--muted);font-size:.88rem}
.card .msg{font-size:.92rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .flag{font-size:.82rem;color:var(--gF);font-weight:600}
.more{align-self:center}
details.panel>summary{cursor:pointer;font-weight:700;list-style-position:outside}
details.refine .controls{margin-top:4px}
.find{display:flex;flex-direction:column;gap:8px}
.find input{width:100%;font-size:1.05rem;padding:11px 14px;border-radius:10px;background:var(--panel)}
.findres{display:flex;flex-direction:column}
.hit{display:flex;gap:10px;align-items:center;padding:9px 6px;border-bottom:1px solid var(--rule);color:inherit;text-decoration:none}
.hit:hover{background:var(--accent-soft)}
.explore{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.explore a{display:flex;flex-direction:column;gap:4px;background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:14px;color:inherit;text-decoration:none}
.explore a:hover{border-color:var(--accent)}
.explore strong{color:var(--accent);font-family:var(--f-display)}
.explore span{font-size:.9rem;color:var(--muted)}
.shead{display:flex;gap:16px;align-items:flex-end}
details.sect{gap:0;padding:0}
details.sect>summary{display:flex;flex-direction:column;gap:2px;padding:14px 18px;list-style:none}
details.sect>summary::-webkit-details-marker{display:none}
details.sect>summary .st{font:700 1.05rem var(--f-display);color:var(--accent)}
details.sect>summary .st::before{content:"+ ";}
details.sect[open]>summary .st::before{content:"− ";}
details.sect>summary .sh{font-size:.88rem;color:var(--muted);font-weight:400}
details.sect>div,details.sect>.md{padding:0 18px 18px}
details.sect .panel{border:0;padding:0;background:none}
details.sect .panel>h2{display:none}
details.why-t{border:1px solid var(--rule);border-radius:10px;padding:8px 12px;background:var(--panel)}
details.why-t>summary{cursor:pointer;display:flex;flex-wrap:wrap;align-items:center;gap:8px;list-style-position:outside}
details.why-t[open]>summary{margin-bottom:6px}
ol.steps{margin:6px 0 4px;padding-left:1.3em;display:grid;gap:10px}
ol.steps>li>.why{margin-top:6px}
.cite{color:var(--ink);font-style:italic}
#whyfor{max-width:100%}
.hero,.res,.find{max-width:820px}
/* explore menu */
details.menu{position:relative}
details.menu>summary{list-style:none;cursor:pointer;font:600 .95rem var(--f-body);color:var(--muted);padding:6px 10px;border-radius:6px}
details.menu>summary::-webkit-details-marker{display:none}
details.menu>summary::after{content:" ▾";font-size:.8em}
details.menu>summary[aria-current="page"],details.menu[open]>summary{color:var(--accent);background:var(--accent-soft)}
.menu-list{position:absolute;right:0;top:calc(100% + 6px);z-index:6;display:flex;flex-direction:column;min-width:230px;background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.menu-list a{padding:10px 12px!important}
@media (max-width:640px){.menu-list{right:auto;left:auto}.card{grid-template-columns:44px minmax(0,1fr) auto;gap:10px}.cover{width:44px;height:63px}.cover.lg{width:64px;height:92px}}
/* friendly theme (2026-11-23): warm paper, store fonts, softer cards, cover shelf */
html{font-synthesis:none;-webkit-text-size-adjust:100%}
h1,h2,h3,.iam,.brand,.card .t,.row .t,.gbtn strong,.explore strong,.message,details.sect>summary .st,details.full summary{font-weight:400!important}
h1{font-size:clamp(2rem,6vw,2.9rem);line-height:1.12;letter-spacing:-.005em}
h2{font-size:1.32rem}
.eyebrow{font:800 .74rem/1.3 var(--f-body);letter-spacing:.09em;color:var(--warm)}
.lede{font-size:1.08rem}
header.mast{background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:saturate(1.2) blur(8px);-webkit-backdrop-filter:saturate(1.2) blur(8px);border-bottom:1px solid var(--rule)}
.brand{font:400 1.22rem/1.1 var(--f-display);align-items:center}
.brand svg{flex:none}
.brand small{font:800 .62rem var(--f-body);letter-spacing:.1em;color:var(--warm);background:var(--warm-soft);padding:2px 6px;border-radius:999px}
nav.tabs a,details.menu>summary{border-radius:999px;padding:7px 12px}
.hero{gap:14px}
.welcome{position:relative;display:flex;flex-direction:column;gap:10px;padding:22px 20px 20px;border-radius:22px;background:linear-gradient(160deg,var(--warm-soft),var(--accent-soft));overflow:hidden}
.welcome .leaf{position:absolute;right:-34px;top:-30px;opacity:.1;pointer-events:none}
.welcome>*{position:relative}
.step,.panel,.card,.explore a,.controls,.verdict,details.why-t{border-radius:18px;border-color:var(--rule);box-shadow:var(--shadow)}
.step{padding:20px;gap:14px}
.step h2{font-size:1.28rem}
.num{background:var(--warm);color:#fffdf8;width:2rem;height:2rem;font:800 1rem var(--f-body)}
.pill{font:700 .95rem var(--f-body);background:var(--paper);border:1.5px solid var(--rule);transition:background .15s,border-color .15s,transform .1s}
.pill:hover{border-color:var(--accent);background:var(--accent-soft)}
.pill:active{transform:scale(.97)}
.pills.big{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.pills.big .pill{font-size:1.05rem;min-height:52px;border-radius:14px}
.gbtn{background:var(--paper);border-radius:16px;padding:16px;transition:border-color .15s,background .15s}
.gbtn strong{font-size:1.12rem}
.linkbtn{color:var(--accent);font-weight:700}
.choices{border-radius:999px;padding:10px 18px;background:var(--accent-soft)}
.card{grid-template-columns:64px minmax(0,1fr) auto;gap:14px;padding:12px 14px 12px 12px;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--accent);transform:translateY(-1px)}
.card .t{font-size:1.12rem}
.cover{width:64px;height:92px;border-radius:4px 8px 8px 4px;box-shadow:0 1px 2px rgba(60,40,20,.18),0 3px 8px rgba(60,40,20,.14);background:var(--tone)}
.cover.lg{width:124px;height:178px}
.grade{border-radius:12px}
.chip{font:700 .76rem/1.3 var(--f-body);border-radius:999px;padding:4px 10px}
.count{font:600 .85rem var(--f-body)}

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let D = null;
const state = {q:'', analyzed:false, maxLevel:'any', pub:'', sort:'popularity', idea:'Classical virtue ethics', profile:'Christian (any)', maxInt:'any', genre:'', adult:false, age:''};
try { Object.assign(state, JSON.parse(localStorage.getItem('mwg-state2') || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem('mwg-state2', JSON.stringify(state)); } catch (e) {} };

const GRADES = ['S','A','B','C','D','F'];
// Cover art is shown straight from AniList's image CDN (the image the AniList API provides for display); nothing is copied into this site.
const coverSrc = (s, size='small') => s.cover ? s.cover.replace('/medium/', '/' + size + '/') : '';
const coverImg = (s, cls='cover', size='small', eager=false) => s.cover ? `<img class="${cls}" src="${esc(coverSrc(s, size))}" alt="Cover of ${esc(s.title)}" ${eager?'':'loading="lazy" '}decoding="async" referrerpolicy="no-referrer" onerror="this.removeAttribute('src');this.alt=''">` : `<span class="${cls}"></span>`;
const GRADE_TEXT = {S:['Excellent fit','Affirms core values, little to raise'],A:['Strong fit','A few small concerns'],B:['Good with talk','Some things to discuss'],C:['Mixed','Real concerns alongside good themes'],D:['Serious concerns','Many would wait or read together'],F:['Conflicts','At odds with core teaching throughout']};
let CHRISTIAN = [], GROUPS = [];
function setGroups(g) { CHRISTIAN = g[0][1]; GROUPS = g.map(([n, items], i) => [n, i === 0 ? ['Christian (any)', ...items] : items]); }
const PILLS = ['Christian (any)','Catholic','Baptist','Non-denominational Evangelical','Pentecostal / Charismatic','Eastern Orthodox','Orthodox Jewish','Muslim','Conservative / traditional','Secular progressive'];

function provisional(f, overall) {
  if (f.grade) return {g: f.grade, prov: false};
  const g = f.weight === 'Minor' ? 'A' : f.weight === 'Discuss' ? 'B' : f.weight === 'Significant' ? 'C' : null;
  return {g, prov: true};
}
function fitFor(e, p) {
  const names = p === 'Christian (any)' ? CHRISTIAN : [p];
  const fs = e.frames.filter(f => names.includes(f.frame));
  if (!fs.length) return null;
  const gs = fs.map(f => ({...provisional(f, e.overall), f})).filter(x => x.g);
  if (!gs.length) return null;
  const idx = gs.map(x => GRADES.indexOf(x.g)).sort((a,b)=>a-b);
  const mid = idx[Math.floor((idx.length - 1) / 2)];
  const lo = GRADES[idx[0]], hi = GRADES[idx[idx.length-1]];
  return {g: GRADES[mid], prov: gs.some(x=>x.prov), range: lo !== hi ? `${lo} to ${hi}` : null, f: gs.find(x=>GRADES.indexOf(x.g)===mid).f, n: gs.length, all: gs};
}
const gradeTile = (g, prov, cls='') => g ? `<span class="grade ${cls} g-${g} ${prov?'prov':''}" title="${esc(GRADE_TEXT[g][0])}${prov?' (provisional)':''}">${g}</span>` : `<span class="grade ${cls}" title="Not graded yet">–</span>`;
function meter(v, withText = true) {
  if (v == null) return '<span class="intensity">Not rated yet</span>';
  const n = Math.round(v), cls = n >= 7 ? 'hi' : n >= 4 ? 'mid' : 'lo';
  return `<span class="intensity"><span class="meter ${cls}" aria-hidden="true">${Array.from({length:10},(_,i)=>`<i class="${i<n?'on':''}"></i>`).join('')}</span>${withText ? v + ' / 10' : ''}</span>`;
}
const OUTLOOK = {h:['Hopeful','The story argues that goodness, love or effort can win out, and it ends or points that way.'], m:['Bittersweet','Hope and goodness are real, but the story counts heavy losses, holds its ideals at great cost, or leaves the outcome open.'], b:['Bleak','The story shows a cruel or indifferent world with little way out, often as a warning or a tragedy.']};
const outlookChip = s => s.outlook && OUTLOOK[s.outlook] ? `<span class="ol ol-${s.outlook}" title="${esc(OUTLOOK[s.outlook][1])}">${OUTLOOK[s.outlook][0]}</span>` : '';
const PLAIN = {'Classical virtue ethics':'virtue and character','Communitarianism':'community and belonging','Expressive individualism':'being true to yourself','Pragmatism':'practical problem-solving','Hedonism':'pleasure-seeking','Might makes right':'"might makes right"','Existentialism':'making your own meaning','Absurdism':'finding meaning in absurdity','Nihilism':'nihilism (nothing matters)','Anti-natalism':'anti-natalism','Collectivism/authoritarianism':'authoritarian control','Consumerism':'consumerism','Critical theory':'critique of power','Feminism':'feminism','Postmodernism':'postmodernism','Environmentalism':'care for nature','Libertarianism':'personal freedom','Traditionalism':'tradition','Progressivism':'progressive change','Confucian ethics':'duty and respect for elders','Stoicism':'Stoic self-control','Utilitarianism':'the greater good','Secular humanism':'secular humanism','Naturalism':'naturalism','Transhumanism':'transhumanism','Moralistic therapeutic deism':'"be nice, God wants you happy"','Pagan/occult':'pagan or occult ideas','Pantheist/New Age':'New Age spirituality','Dharmic (Hindu/Buddhist)':'Hindu or Buddhist ideas','Marxism':'Marxism','Christian':'Christian ideas','Jewish':'Jewish ideas','Islamic':'Islamic ideas'};
const plain = l => PLAIN[l.lens] || (l.label || l.lens || '').toLowerCase();
function ideasLine(e) {
  const ls = e && e.lenses || [], by = k => ls.filter(l => stanceKey(l.stance) === k).sort((a,b)=>(b.strength||0)-(a.strength||0));
  const aff = by('Affirmed').slice(0, 2), crit = by('Critiqued').slice(0, 1);
  const part = (w, xs) => xs.length ? `<b>${w}</b> ${xs.map(l=>`<span title="${esc(l.label||l.lens)}">${esc(plain(l))}</span>`).join(', ')}` : '';
  const h = [part('Champions', aff), part('Pushes back on', crit)].filter(Boolean).join(' · ');
  return h ? `<div class="ideas">${h}</div>` : '';
}
const STYLE_W = {'Subtle':1,'Woven in':2,'Explicit':3,'Heavy-handed':4};
const VERB = {for:'Argues for', against:'Argues against', explores:'Explores'};
const dirOf = st => { const k = stanceKey(st); return k === 'Affirmed' ? 'for' : k === 'Critiqued' ? 'against' : 'explores'; };
// Main function: the idea the story is most built around (strength), preferring one it takes a side on when close. Push: how central (strength) plus how openly it argues (delivery style).
function mainFn(e) {
  if (!e || e._mf !== undefined) return e ? e._mf : null;
  const ls = (e.lenses||[]).filter(l => stanceKey(l.stance) !== 'Incidental' && (l.strength||0) > 0);
  if (!ls.length) return e._mf = null;
  const sc = l => (l.strength||0) + (dirOf(l.stance) === 'explores' ? 0 : 0.5);
  const m = [...ls].sort((a,b)=>sc(b)-sc(a))[0], st = e.delivery && e.delivery.style;
  const push = Math.max(1, Math.min(10, Math.round((m.strength||0) * 0.6 + (STYLE_W[st] || 2))));
  return e._mf = {lens: m.lens, label: m.label || m.lens, k: dirOf(m.stance), push, style: st || ''};
}
const PLAIN_CAP = l => { const s = PLAIN[l] || l; return s[0] === '"' ? '"' + s[1].toUpperCase() + s.slice(2) : s[0].toUpperCase() + s.slice(1); };
const pushLabel = v => v <= 4 ? 'Light' : v <= 6 ? 'Moderate' : 'Strong';
const pushBar = m => `<span class="push" title="How hard the story pushes its main idea: how central it is (0 to 10) plus how openly it argues it (${esc(m.style || 'delivery not recorded')}). Force, not approval."><span class="pb"><span style="width:${m.push*10}%"></span></span>${pushLabel(m.push)} push · ${m.push}/10</span>`;
const mfLine = (s, size = 'sm') => { const m = mainFn(s.entry); return m ? `<div class="mf ${size} k-${m.k}"><span class="verb">${VERB[m.k]}</span><span class="idea" title="${esc(m.label)}">${esc(PLAIN_CAP(m.lens))}</span></div>` : ''; };
const coverGrade = (s, tile, cls = 'cover', size = 'small') => s.cover ? `<span class="cvg">${coverImg(s, cls, size)}${tile}</span>` : tile;
const MF_OPTS = () => { const c = {}; D.series.forEach(s => { const m = mainFn(s.entry); if (m && m.k !== 'explores') { const k = m.k + ':' + m.lens; c[k] = (c[k]||0) + 1; } }); return Object.entries(c).sort((a,b)=>b[1]-a[1]); };
const mfSelect = id => `<label for="${id}">Main idea<select id="${id}"><option value="">Any main idea</option>${MF_OPTS().map(([k,n])=>{ const [d,l] = k.split(':'); return `<option value="${esc(k)}" ${state.mf===k?'selected':''}>${d==='for'?'For':'Against'}: ${esc(PLAIN[l]||l)} (${n})</option>`; }).join('')}</select></label>`;
const mfOk = s => { if (!state.mf) return true; const m = mainFn(s.entry); return !!m && (m.k + ':' + m.lens) === state.mf; };
const philo = s => s.entry && s.entry.life_message ? `<p class="philo">${esc(s.entry.life_message)}</p>` : '';
const hopeRank = s => ({h:0, m:1, b:2})[s.outlook] ?? 3;
const outlookOk = s => !state.outlook || (state.outlook === 'h' ? s.outlook === 'h' : state.outlook === 'hm' ? (s.outlook === 'h' || s.outlook === 'm') : true);
const outlookSelect = id => `<label for="${id}">Outlook<select id="${id}">${[['','Any outlook'],['h','Hopeful only'],['hm','Hopeful or bittersweet']].map(([v,l])=>`<option value="${v}" ${(state.outlook||'')===v?'selected':''}>${l}</option>`).join('')}</select></label>`;
const stanceKey = s => { s = (s||'').toLowerCase(); return s.startsWith('affirm') ? 'Affirmed' : s.startsWith('critiq') ? 'Critiqued' : /^(explor|contest|echo)/.test(s) ? 'Explored' : 'Incidental'; };
function closeness(l) {
  if (l.closeness) return l.closeness;
  const k = stanceKey(l.stance), s = l.strength || 0;
  if (k === 'Affirmed') return s >= 7 ? 'S' : s >= 5 ? 'A' : s >= 3 ? 'B' : 'C';
  if (k === 'Explored') return s >= 6 ? 'B' : 'C';
  if (k === 'Critiqued') return s >= 6 ? 'F' : 'D';
  return 'C';
}
const confChip = s => s.entry ? `<span class="chip sum" title="Built from summaries, databases and reviews. No pages read yet.">${esc(s.entry.label)} · ${esc(s.entry.confidence)} confidence</span>` : `<span class="chip db">Not analyzed yet</span>`;
const pubs = s => (s.publishers||[]).map(p=>p.name).filter(n=>!/manga ?plus|k manga|inkr|renta|mangaplaza|coolmic|webtoon|manga up|manga million/i.test(n));
const link = s => s.id ? `#s-${s.id}` : `#e-${s.entry.slug}`;
const subline = s => [s.native, s.year, pubs(s).join(', ')].filter(Boolean).map(esc).join(' · ');

const MC_ANCHORS = [['0','None'],['1 to 3','Mild: cartoon fights, a kiss, a few rude words, brief peril'],['4 to 6','Moderate: blood and injury, frightening scenes, innuendo or fan service, some swearing, drinking'],['7 to 8','Strong: graphic violence, nudity or sexual situations, frequent strong language, self-harm shown'],['9 to 10','Extreme: gore and torture, explicit sex or sexual violence, drug use shown in detail']];
const MC_LEGEND = `<p>This number answers one question: <strong>how much mature content is on the page?</strong> It is scored separately for violence, fear and intensity, sexuality and romance, language, substances, mental health and self-harm, imitable behavior, and commercialism. The headline number on each series is the <strong>highest</strong> of those categories, so a 9 can come from violence alone.</p>
  <p>It does not say whether the story is good or bad, or whether it approves of what it shows. A war story can score 9 for violence while condemning war. The S to F grade covers how the message fits your tradition.</p>
  <div class="scroll"><table><tbody>${MC_ANCHORS.map(([n,t])=>`<tr><td class="num" style="white-space:nowrap"><strong>${n}</strong></td><td>${t}</td></tr>`).join('')}</tbody></table></div>`;
const topCats = s => { const c = (s.entry?.content||[]).filter(x=>(x.score||0)>=4).sort((a,b)=>b.score-a.score).slice(0,2); return c.length ? `<div class="note" style="font-size:.75rem;margin-top:2px">${c.map(x=>esc(x.category.split(' and ')[0])+' '+x.score).join(' · ')}</div>` : ''; };
const mcTitle = s => s.entry ? 'Mature content, 0 none to 10 extreme. The highest category: ' + (s.entry.content||[]).map(x=>x.category+' '+x.score).join(', ') : 'Not rated yet';
const mcChip = s => s.entry ? `<span class="chip mc" title="${esc(mcTitle(s))}">Mature content ${esc(s.entry.overall)}/10</span>` : '';
function row(s, tile, body = '', chips = '') {
  let mat = isAdult(s) ? '<span class="chip" style="color:var(--gF);border-color:currentColor">18+ adult title</span>' : bandChip(s) + pubChip(s);
  mat += mcChip(s);
  if (s.entry && (s.entry.understated||[]).length) mat += '<span class="chip" title="' + esc(s.entry.understated.join('; ')) + '">Intensity may be understated</span>';
  const m = mainFn(s.entry);
  return `<a class="row" href="${link(s)}">${coverGrade(s, tile)}<div style="min-width:0"><div class="t">${esc(s.title)}</div>${m ? `<div style="display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center">${mfLine(s)}${pushBar(m)}</div>` : ''}${philo(s)}${body}<div class="sub">${subline(s)}</div><div class="chips">${outlookChip(s)}${chips}${mat}${confChip(s)}</div></div></a>`;
}
function profileSelect(id, p) {

      h += sect('How the message is delivered', `${esc(d.style)}, preachiness ${esc(d.preachiness)} / 10${d.opposing_views?`, opposing views: ${esc(d.opposing_views.toLowerCase())}`:''}`,
        `<p><b>${esc(d.style)}:</b> ${esc(ST[d.style]||'')}. The story ${esc(OV[d.opposing_views]||'has not been checked for how it treats opposing views')}.</p>
        ${d.note?`<p>${esc(d.note)}</p>`:''}
        ${(d.personified||[]).length?`<h3>Ideas given a face</h3><div class="scroll"><table><thead><tr><th>Character</th><th>Stands for</th><th>Role</th><th>Drawn</th></tr></thead><tbody>${d.personified.map(x=>`<tr><td>${esc(x.character)}</td><td>${esc(x.ideology)}</td><td>${esc(x.role)}</td><td>${esc(x.treatment)}</td></tr>`).join('')}</tbody></table></div>`:''}
        ${d.evidence?`<p class="note">Evidence: ${esc(d.evidence)}</p>`:''}
        <p class="note">"Strawman" means the other side's view is shown only through hateful or foolish characters and never in its best form. We use "Heavy-handed" or "Strawman" only when a review or summary supports it. Anything marked "to verify" is our default until someone reads the series.</p>`); }
    h += sect('What is on the page', `${esc(e.overall)} / 10${top&&top.score?`, highest: ${esc(top.category.toLowerCase())}`:''}`,
      `<p class="note">How much of each kind of mature content the series shows, from 0 (none) to 10 (extreme). It measures how much is on the page, not whether the story approves of it.</p>
      <div class="scroll"><table><tbody>${e.content.map(c=>`<tr><td>${esc(c.category)}<div class="note" style="font-size:.84rem">${esc(c.framing)}</div></td><td class="num">${meter(c.score)}</td></tr>`).join('')}</tbody></table></div>
      <p class="note">${e.quick?'Quick read built from Wikipedia and database tags.':'Built from summaries, databases and reviews.'} No pages have been read yet, so scores may change. Confidence: <strong>${esc(e.confidence)}</strong>.${(e.understated||[]).length?` <strong>Intensity may be understated:</strong> ${e.understated.map(esc).join('; ')}. Treat these scores as a minimum.`:''}</p>`);
    const gs = e.frames.map(f=>provisional(f).g).filter(Boolean).sort((a,b)=>GRADES.indexOf(a)-GRADES.indexOf(b));
    h += sect('How every tradition grades it', gs.length ? `${e.frames.length} traditions, ${gs[0]===gs[gs.length-1]?`all ${gs[0]}`:`${gs[0]} to ${gs[gs.length-1]}`}` : '',
      `<div class="scroll"><table><thead><tr><th>Tradition</th><th>Grade</th><th>Depiction concern</th><th>What fits</th><th>What may concern</th></tr></thead><tbody>
      ${e.frames.map(f=>{ const g = provisional(f); return `<tr><td>${esc(f.frame)}${f.legacy?'<div class="note" style="font-size:.8rem">Older combined grade</div>':''}</td><td>${gradeTile(g.g, g.prov, 'sm')}</td><td>${esc(f.weight||'')}</td><td>${esc(f.aligns)}</td><td>${esc(f.concerns)}</td></tr>`; }).join('')}</tbody></table></div>
      <p class="note">Traditions not listed here have not been graded for this series yet.</p>`);
    h += sect('Political and moral leanings', '', `<div class="grid2">
      <div class="stack">${[['economic','Economic','Collective','Free market'],['social','Social','Authority','Liberty'],['cultural','Cultural','Traditional','Progressive'],['community','Community','Individual first','Community first']].map(([k,n,a,b])=> e.axes[k]==null?'':`<div class="axis"><span>${n} <span class="count">${e.axes[k]}</span></span><span class="track" role="img" aria-label="${n}: ${e.axes[k]} of 10, ${a} to ${b}"><span class="dot" style="left:${e.axes[k]*10}%"></span></span><span class="ends"><span>${a}</span><span>takes no side</span><span>${b}</span></span></div>`).join('')}</div>
      <div class="stack"><h3>Moral foundations</h3><div class="bars" style="grid-template-columns:minmax(0,7rem) minmax(0,1fr) 2rem">${Object.entries(e.foundations||{}).map(([k,v])=>`<span>${k[0].toUpperCase()+k.slice(1)}</span><span class="b"><span style="width:${v*10}%"></span></span><span class="v">${v}</span>`).join('')}</div></div></div>`);
    if (e.folkways) h += sect('Everyday values and culture', e.folkways.closest?.length ? 'Closest: ' + e.folkways.closest.map(esc).join(', ') : '', folkwaysPanel(e));
    if (e.quick) {
      h += sect('Story, winners and losers', 'Quick read', `${e.premise?`<p>${esc(e.premise)}</p>`:''}${e.winners_losers?`<h3>Winners, losers and sympathy</h3><p>${esc(e.winners_losers)}</p>`:''}
        <h3>Content notes</h3><ul>${e.content.filter(c=>c.note).map(c=>`<li><b>${esc(c.category)}:</b> ${esc(c.note)}</li>`).join('')}</ul>
        ${(e.to_verify||[]).length?`<h3>To check in a full read</h3><ul>${e.to_verify.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:''}
        <p class="note">Sources: ${(e.sources||[]).map(u=>`<a href="${esc(u)}">${esc(u.replace(/^https?:\/\/(www\.)?/,'').split('/')[0])}</a>`).join(', ')}.</p>`);
    } else {
      h += `<details class="panel sect full" id="fullentry"><summary><span class="st">The full essay</span><span class="sh">Philosophy, winners and losers, creators, how readers took it, sources</span></summary><div class="md" id="md"><p class="empty">Loading the entry…</p></div></details>`;
    }
  } else {
    h += `<div class="banner">This series hasn't been analyzed yet, so it has no grades. Below are database facts and content tags other sites have attached. They are signals, not ratings.</div><div class="stack" style="gap:10px">`;
  }
  const sig = Object.entries(s.signals||{});
  h += sect('Series facts and database tags', '', `<div class="scroll"><table><tbody>${facts.map(([k,v])=>`<tr><th scope="row">${esc(k)}</th><td>${esc(v)}</td></tr>`).join('')}</tbody></table></div>
    <p class="note">${[s.id&&`<a href="https://anilist.co/manga/${s.id}">AniList</a>`, s.mu&&`<a href="https://www.mangaupdates.com/series/${Number(s.mu).toString(36)}">MangaUpdates</a>`].filter(Boolean).join(' · ')}</p>
    <h3>Content tags from other databases</h3>
    ${sig.length||s.mu_signals?.length ? `<div class="scroll"><table><tbody>${sig.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.map(t=>esc(t.tag)+(t.rank?` <span class="count">${t.rank}%</span>`:'')).join(', ')}</td></tr>`).join('')}
    ${s.mu_signals?.length?`<tr><td>MangaUpdates categories</td><td>${s.mu_signals.map(esc).join(', ')}</td></tr>`:''}</tbody></table></div>
    <p class="note">AniList tags with the share of readers who agreed they apply (50% or more shown), and MangaUpdates categories. Volunteer-tagged and unverified.</p>` : '<p class="note">No content tags found in AniList or MangaUpdates.</p>'}`, !e);
  return h + `</div></div>`;
}


const tslug = n => n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
function guidesBody() {
  if (!R) return '<p class="empty">Loading the guides…</p>';
  return GROUPS.map(([gname, items]) => `<h3>${esc(gname)}</h3>` + items.filter(n=>R.frames[n]).map(n => { const G = R.frames[n];
    return `<details class="why-t" id="tr-${tslug(n)}"><summary><b>${esc(n)}</b></summary><div class="stack" style="gap:8px">
    ${[['Core beliefs',G.beliefs],['What it values',G.values],['What it forbids or discourages',G.forbids],['Family, sex and identity',G.family],['Stories, fiction and art',G.stories],['Range within the tradition',G.range]].filter(x=>x[1]).map(([k,v])=>`<p><b>${k}:</b> ${esc(v)}</p>`).join('')}
    <div class="scroll"><table><thead><tr><th>Topic</th><th>Usual position</th></tr></thead><tbody>${Object.entries(G.topics).map(([k,v])=>`<tr><th scope="row">${esc(k)}</th><td>${esc(v)}</td></tr>`).join('')}</tbody></table></div>
    ${G.media?`<p><b>Teaching on art, media and depiction:</b> ${esc(G.media)}</p>`:''}
    <p class="note">Own sources: ${esc(G.sources)}.${G.status==='draft'?' Status: draft from general knowledge, being checked against these sources.':''}</p></div></details>`; }).join('')).join('');
}
function viewMethod() {
  return `<div class="stack md" style="max-width:72ch"><h1 style="display:block">How we grade</h1>
  <p class="lede">This guide describes what each manga holds up as true, good and worth living for. Every description is written once, in neutral words, and is the same for every reader. Your tradition only changes the grade and the order.</p>
  <h2>Main function and push</h2><p>Every analyzed series opens with its <strong>main function</strong>: the one idea it is most built around, and whether it <strong>argues for</strong> it, <strong>argues against</strong> it, or only <strong>explores</strong> it. It is the strongest of the philosophies we check, preferring one the story takes a side on when two are close.</p>
  <p><strong>Push</strong> (1 to 10) is how hard the story presses that idea. It adds how central the idea is (its strength, 0 to 10, weighted 0.6) to how openly the story argues it (subtle 1, woven into the plot 2, explicit 3, heavy-handed 4). Light is 1 to 4, Moderate 5 to 6, Strong 7 to 10. Push measures force, not approval: a story can push hard for an idea your tradition rejects, or argue against one it holds. The series page also shows the other ideas it carries and which characters carry each one.</p>
  <h2>What each story argues</h2><p>Every analyzed series opens with one plain sentence on what it argues about life: what it holds up as good and worth living for. It is drawn from the story itself (who is rewarded, who changes, how it ends), not from how dark it looks. Many violent or sad series argue for mercy, sacrifice or hope. Below the sentence are the ideas the story <strong>champions</strong> and the one it most <strong>pushes back on</strong>, in plain words; the full list is under "Philosophies it leans toward".</p>
  <p>Each series also has an <strong>outlook</strong>. It describes the story's view of life, not its quality or its fit for your family:</p>
  <div class="olkey">${Object.entries(OUTLOOK).map(([k,[n,d]])=>`<div><span class="ol ol-${k}">${n}</span><span>${d}</span></div>`).join('')}</div>
  <p>A bleak story can still be worth reading as a warning, and a hopeful one can still conflict with your tradition. Maturity and age are rated separately and shown as small badges.</p>
  <h2>The S to F grade</h2><p>Each analyzed series is read from inside each tradition using that tradition's own teaching, such as the Catechism for Catholics, the Baptist Faith and Message for many Baptists, or the Five Precepts for Buddhists.</p>
  <ul>${GRADES.map(g=>`<li><strong>${g}: ${GRADE_TEXT[g][0]}.</strong> ${GRADE_TEXT[g][1]}.</li>`).join('')}</ul>
  <p>The grade is about the message: how well what the series holds up as good fits the tradition's teaching, including its own teaching on art and stories. It is not lowered just because a series is intense. What is shown on the page is rated separately as a <strong>depiction concern</strong> for each tradition: Minor (little to raise), Discuss (worth talking through) or Significant (many families would hold off or read together).</p><p>A grade with a dashed border is provisional. It is worked out from the depiction concern until the entry is graded directly. A row marked "Older combined grade" was written before the tradition was split into branches and will be re-graded.</p>
  <h2>How a grade is reached, step by step</h2><ol>
  <li><strong>Gather the story facts.</strong> From official synopses, publisher ratings, parent guides, reviews and database tags, we note what the series shows and how it frames it: who wins, who is shown sympathetically, what is rewarded and what has consequences.</li>
  <li><strong>Read them through each tradition's guide.</strong> Each of the ${GROUPS.flatMap(g=>g[1]).length - 1} traditions has a written guide: its core beliefs, what it values and forbids, its position on twelve common topics (violence, sexuality, magic and spirits, other religions, authority, death and more), and its own teaching on art and stories. The guides are listed below.</li>
  <li><strong>Grade the message.</strong> For each tradition we ask: does the series endorse what it shows or only depict it? Is evil framed as evil? Are there consequences? Is repentance, redemption or justice possible? How are sacred things treated? The answer becomes the S to F grade, with one line on what fits and one on what may concern.</li>
  <li><strong>Rate the depiction concern separately.</strong> Using the mature-content scores and the tradition's teaching on depiction, we record whether what is shown is a Minor, Discuss or Significant concern for that tradition.</li>
  <li><strong>Record sources and confidence.</strong> Every entry lists the pages used, a confidence level, and what still needs checking against the printed pages.</li></ol>
  <p>Every graded series has a <strong>How we reached this grade</strong> section that walks through these steps for each tradition. Deep entries also name the specific teaching cited, such as a Catechism paragraph or a verse. Quick reads show the matching positions from the tradition's guide instead, and say so.</p>
  <h2>Mature content (0 to 10)</h2>${MC_LEGEND}
  <h2>Suggested age bands</h2>${BAND_LEGEND}
  <h2>Philosophies</h2><p>Each series is checked against more than thirty worldviews and philosophies, from Christian and Buddhist to Stoicism, Utilitarianism, Pragmatism and Nihilism. Closeness runs from S (strongly affirmed) to F (strongly critiqued).</p>
  <h2>What each label means</h2><ul><li><strong>Not analyzed yet.</strong> English publisher, creators and content tags from AniList, MangaUpdates and MangaDex only.</li>
  <li><strong>From summaries.</strong> Built from official synopses, publisher ratings, parent guides, reviews and fan-wiki plot facts. No pages read. Every fact that moves a score needs two independent sources.</li>
  <li><strong>Full read.</strong> Checked against the official English edition and signed off by a reviewer.</li></ul>
  <h2>Sources</h2><p>AniList, MangaUpdates, MangaDex, Wikipedia, publisher pages, parent guides and reviews. Fan wikis are used for plot facts only and never quoted. We never use pirated scans or fan translations.</p>
  <h2>Each tradition's standard</h2><p>These guides are the yardstick for every grade. Each is written in the tradition's own terms and lists the sources it draws on. All are still drafts written from general knowledge and are being checked against those sources.</p>
  <div id="guides" class="stack" style="gap:8px">${guidesBody()}</div>
  <p class="note">Catalog built ${esc(D.built)}. ${D.series.length} series in this preview.</p></div>`;
}

async function loadMd(slug) {
  const el = $('#md'); if (!el) return;
  try { const t = await (await fetch(`entries/${slug}.md`)).text(); el.innerHTML = DOMPurify.sanitize(marked.parse(t)); el.querySelectorAll('a').forEach(a=>{a.target='_blank';a.rel='noopener'}); }
  catch (err) { el.innerHTML = '<p class="empty">The full entry could not load. Reload the page to try again.</p>'; }
}
function render() {
  D.series = state.adult ? ALL : ALL.filter(x=>!isAdult(x));
  const h = location.hash.slice(1) || 'start'; let html, view = h, md = null;
  if (h.startsWith('s-') || h.startsWith('e-')) {
    const s = h.startsWith('s-') ? ALL.find(x=>String(x.id)===h.slice(2)) : ALL.find(x=>x.entry?.slug===h.slice(2));
    html = s ? viewSeries(s) : '<p class="empty">Series not found. <a href="#browse">See all manga</a>.</p>'; view = 'series'; md = s?.entry?.slug; CUR = s;
  } else if (h === 'see-hope') { Object.assign(state, {outlook:'h', mf:'', analyzed:true, sort:'popularity', genre:''}); save(); location.replace('#browse'); return; }
  else if (h.startsWith('see-mf-')) { Object.assign(state, {mf: decodeURIComponent(h.slice(7)), outlook:'', analyzed:true, sort:'push', genre:''}); save(); location.replace('#browse'); return; }
  else if (h === 'hopeful') { state.outlook = 'h'; state.analyzed = true; state.sort = 'popularity'; save(); location.replace('#browse'); return; }
  else if (h === 'browse') html = viewBrowse();
  else if (h === 'ideas' || h === 'lenses') { html = viewIdeas(); view = 'ideas'; }
  else if (h === 'method' || h.startsWith('method-')) { html = viewMethod(); view = 'method'; }
  else if (h === 'values') html = viewValues();
  else if (h === 'deep' && window.viewDeep) html = viewDeep();
  else if (h === 'popular') html = viewPopular();
  else { html = viewStart(); view = 'start'; }
  $('#app').innerHTML = html;
  document.querySelectorAll('nav.tabs a').forEach(a=>{ if (a.dataset.view===view) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  const menu = $('#menu'); if (menu) { menu.open = false; const sm = menu.querySelector('summary'); if (['popular','browse','ideas','values','deep','method'].includes(view) && !h.startsWith('s-') && !h.startsWith('e-')) sm.setAttribute('aria-current','page'); else sm.removeAttribute('aria-current'); }
  if (md) loadMd(md);
  if (view === 'series' || view === 'method') { const had = !!R, cur = view === 'series' && CUR?.entry ? CUR : null;
    loadReasons().then(d => { if (!d || location.hash.slice(1) !== h) return;
      if (!had) { const w = $('#why'), gd = $('#guides'); if (w && cur) { w.innerHTML = whyBody(cur); bindWhy(cur); } if (gd) gd.innerHTML = guidesBody(); }
      if (h.startsWith('method-')) { const el = document.getElementById('tr-' + tslug(decodeURIComponent(h.slice(7)))); if (el) { el.open = true; el.scrollIntoView(); } } });
    if (cur) bindWhy(cur); }
  bind();
  if (view === 'deep' && window.bindDeep) bindDeep();
}
function bindWhy(s) {
  const el = document.getElementById('whyfor'); if (!el) return;
  el.addEventListener('change', e => { WHY = {base: state.profile, v: e.target.value}; const w = $('#why'); w.innerHTML = whyBody(s); bindWhy(s); });
}
function bind() {
  const on = (id, ev, fn) => { const el = document.getElementById(id); if (el) el.addEventListener(ev, fn); };
  const set = (k, rerender = true) => e => { state[k] = e.target.type === 'checkbox' ? e.target.checked : e.target.value; save(); if (rerender) render(); };
  on('q','input', e=>{ state.q=e.target.value; save(); const pos=e.target.selectionStart; render(); const q=$('#q'); q.focus(); q.setSelectionRange(pos,pos); });
  ['lvl:maxLevel','pub:pub','sort:sort','an:analyzed','adult:adult','idea:idea','profile:profile','profile2:profile','profile3:profile','popn:popN','psort:popSort','ssort:startSort','maxint:maxInt','olk1:outlook','olk2:outlook','olk3:outlook','mf2:mf','mf3:mf','agesel:age'].forEach(x=>{ const [id,k]=x.split(':'); on(id,'change',set(k)); });
  document.querySelectorAll('.genres button[data-genre]').forEach(b=>b.addEventListener('click',()=>{ state.genre=b.dataset.genre; save(); render(); }));
  document.querySelectorAll('input[data-q]').forEach(r=>r.addEventListener('change',()=>{ QANS[r.dataset.q]=+r.value; }));
  on('quizgo','click',()=>{ if (Object.keys(QANS).length < 6) { const b=$('#quizgo'); b.textContent='Answer at least 6 statements first'; return; } VALS={pos:quizScore(), label:''}; HER=new Set(); VALS_SAVED=false; render(); $('#valres')?.scrollIntoView({behavior:'smooth'}); });
  on('clpick','change',e=>{ const c=(D.clusters||[]).find(x=>x.name===e.target.value); if (c) { VALS={pos:c.pos.slice(), label:c.name}; VALS_SAVED=false; render(); $('#valres')?.scrollIntoView({behavior:'smooth'}); } });
  document.querySelectorAll('input[data-h]').forEach(c=>c.addEventListener('change',()=>{ const i=+c.dataset.h; c.checked?HER.add(i):HER.delete(i);
    const names=[...new Set([...HER].flatMap(j=>D.heritage[j].clusters))]; const cs=(D.clusters||[]).filter(x=>names.includes(x.name));
    if (!cs.length) { VALS=null; render(); return; }
    VALS={pos:D.dims.map((_,k)=>Math.round(cs.reduce((t,x)=>t+x.pos[k],0)/cs.length*10)/10), label:'starting point from heritage', heritage:true, suggest:names}; VALS_SAVED=false; render(); $('#valres')?.scrollIntoView({behavior:'smooth'}); }));
  on('valsave','click',()=>{ try { localStorage.setItem('mwg-values', JSON.stringify(VALS)); VALS_SAVED=true; } catch (e) {} render(); });
  on('valclear','click',()=>{ try { localStorage.removeItem('mwg-values'); } catch (e) {} VALS=null; VALS_SAVED=false; QANS={}; HER=new Set(); render(); });
  document.querySelectorAll('.pill[data-age]').forEach(x=>x.addEventListener('click',()=>{ state.age = x.dataset.age; state.ageDone = true; state.showN = 12; save(); render(); }));
  document.querySelectorAll('.pill[data-p]').forEach(b=>b.addEventListener('click',()=>{ state.profile=b.dataset.p; state.picked = true; state.showN = 12; save(); render(); }));
  document.querySelectorAll('.gbtn[data-tg]').forEach(b=>b.addEventListener('click',()=>{ state.tgroup=b.dataset.tg; save(); render(); }));
  on('skipage','click',()=>{ state.age=''; state.ageDone=true; save(); render(); });
  on('backage','click',()=>{ state.ageDone=false; save(); render(); });
  on('redo','click',()=>{ state.ageDone=false; state.picked=false; save(); render(); });
  on('more','click',()=>{ state.showN=(state.showN||12)+12; save(); const y=scrollY; render(); scrollTo(0,y); });
  on('genre','change',e=>{ state.genre=e.target.value; state.showN=12; save(); render(); });
  on('find','input',e=>{ state.find=e.target.value; const r=$('#findres'); if (r) r.innerHTML=findResults(e.target.value); });
  { const r=$('#findres'); if (r && state.find) r.innerHTML=findResults(state.find); }
}
window.addEventListener('hashchange', ()=>{ WHY = null; render(); window.scrollTo(0,0); });
document.addEventListener('click', e=>{ const m=$('#menu'); if (m && m.open && !m.contains(e.target)) m.open=false; });
fetch('previews.json', {cache: 'no-cache'}).then(r => r.ok ? r.json() : {}).then(p => { PV = p || {}; if (D && /^#[se]-/.test(location.hash)) { const y = scrollY; render(); scrollTo(0, y); } }).catch(() => {});
const OLOAD = fetch('outlook.json', {cache: 'no-cache'}).then(r => r.ok ? r.json() : {}).catch(() => ({}));
fetch('data.json', {cache: 'no-cache'}).then(r=>r.json()).then(d => OLOAD.then(o => { const O = (o && o.series) || {};
  d.series.forEach(s => { const e = s.entry; if (!e) return; const x = O[s.id ? String(s.id) : 'e-' + e.slug]; if (!x) return; s.outlook = x.o; if (!e.life_message && x.msg) e.life_message = x.msg; }); return d; })).then(d=>{ D=d; ALL=d.series; setGroups(d.groups); if (!GROUPS.flatMap(g=>g[1]).includes(state.profile)) state.profile='Christian (any)';
  $('#foot').innerHTML = `<a href="../">The Blessed Fig Tree</a> · Preview build ${esc(d.built)}. Neutral descriptions for every family; your choice only changes grades and order. Data: AniList, MangaUpdates, MangaDex, Wikipedia.`; render(); })
  .catch(()=>{ $('#app').innerHTML = '<p class="empty">The catalog could not load. Reload the page to try again.</p>'; });
</script>
