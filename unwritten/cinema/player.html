<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>McKenzie Palace Theatre</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  /* VOICE: an old small-town movie house at showtime. IDEA: the auditorium itself: red curtains, a gold valance, the lit
     screen. PICTURE: the film on that screen. COLOUR: theater red and gold on near-black. TYPE: the game's pixel face for
     titles, system sans for reading. LAYOUT: the screen first and as large as fits, controls under it, the film's card below. */
  :root{--red:#8e1620;--gold:#d8b45a;--ink:#f1ead8;--dim:#c9bfa6;--bg:#0c0809}
  *{box-sizing:border-box;min-width:0}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,sans-serif}
  .hall{position:relative;display:flex;align-items:center;justify-content:center;padding:30px clamp(30px,9vw,120px) 16px;
    background:radial-gradient(ellipse at 50% 42%,#2c1517 0,#0c0809 72%);overflow:hidden}
  .cur{position:absolute;top:0;bottom:0;width:clamp(26px,8vw,110px);
    background:repeating-linear-gradient(90deg,#5c0a12 0 6px,#8e1620 6px 13px,#b02a34 13px 16px,#6e0f18 16px 22px);
    box-shadow:inset 0 -40px 50px rgba(0,0,0,.55)}
  .cur.l{left:0;border-right:2px solid #3a060b}.cur.r{right:0;border-left:2px solid #3a060b}
  .val{position:absolute;left:0;right:0;top:0;height:20px;background:repeating-linear-gradient(90deg,#7a121c 0 12px,#a52430 12px 20px);
    border-bottom:3px solid var(--gold);box-shadow:0 4px 10px rgba(0,0,0,.6)}
  .screen{position:relative;width:min(100%,calc((100vh - 190px) * 4 / 3));aspect-ratio:4/3;background:#000;
    box-shadow:0 0 0 3px #1a1012,0 0 70px rgba(255,236,200,.13)}
  video,canvas{position:absolute;inset:0;width:100%;height:100%;display:block;background:#000}
  .veil{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:rgba(8,5,6,.86);text-align:center;padding:18px}
  .veil[hidden]{display:none}
  .pix{font:12px/1.6 "Press Start 2P",monospace;color:var(--gold);letter-spacing:.5px}
  .big{font-size:clamp(16px,3.4vw,26px);color:var(--ink)}
  .meter{width:min(280px,70%);height:10px;border:2px solid var(--gold);background:#1a1012}
  .meter i{display:block;height:100%;width:0;background:var(--gold)}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
  button{font:600 14px system-ui,sans-serif;min-height:44px;padding:0 16px;border:2px solid var(--gold);border-radius:6px;background:#2a1215;color:var(--ink);cursor:pointer}
  button:hover,button:focus-visible{background:var(--red);outline:2px solid var(--ink);outline-offset:1px}
  button.play{background:var(--gold);color:#1a0d0e;border-color:var(--gold);font-size:16px;padding:0 22px}
  .bar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:10px clamp(12px,3vw,28px);background:#160d0f;border-top:2px solid #3a1a1e;border-bottom:2px solid #3a1a1e}
  .bar .t{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--dim);font-size:14px}
  input[type=range]{flex:1;min-width:120px;accent-color:var(--gold);height:44px}
  .card{max-width:860px;margin:0 auto;padding:18px clamp(14px,4vw,30px) 40px}
  h1{font:clamp(13px,2.2vw,17px)/1.6 "Press Start 2P",monospace;color:var(--gold);margin:6px 0 4px;text-wrap:balance}
  .meta{color:var(--dim);margin:0 0 12px}
  .card p{margin:0 0 12px;max-width:68ch}
  .src{font-size:13.5px;color:var(--dim);border-top:1px solid #3a1a1e;padding-top:12px}
  a{color:#f0cf7a}
  @media (max-width:600px){.hall{padding-top:26px}.bar{gap:6px}button{padding:0 12px}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head>
<body>
<div class="hall" id="hall">
  <div class="cur l"></div><div class="cur r"></div><div class="val"></div>
  <div class="screen" id="screen">
    <video id="v" playsinline muted preload="auto"></video>
    <div class="veil" id="load"><div class="pix">THREADING THE PROJECTOR</div><div class="meter"><i id="meter"></i></div><div class="pix" id="pct">0%</div></div>
    <div class="veil" id="start" hidden><div class="pix big" id="stitle"></div><div class="pix" id="syear"></div>
      <div class="row"><button class="play" id="go">▶ Start the film</button></div>
      <div style="color:var(--dim);font-size:13px;max-width:44ch">A silent film, as it was made. Space pauses, arrows skip ten seconds, F fills the screen, Esc goes back to the lobby.</div></div>
    <div class="veil" id="end" hidden><div class="pix big">THE END</div>
      <div class="row"><button id="again">Watch again</button><button id="lobby">◀ Back to the lobby</button></div></div>
    <div class="veil" id="err" hidden><div class="pix">THE PROJECTOR JAMMED</div><div id="errmsg" style="max-width:46ch"></div></div>
  </div>
</div>
<div class="bar">
  <button id="pp" aria-label="Play">▶</button>
  <span class="t" id="time">0:00 / 0:00</span>
  <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Position in the film">
  <button id="mus" aria-pressed="true">Music: on</button>
  <button id="snd" aria-pressed="false">Projector sound: off</button>
  <button id="fs">Full screen</button>
</div>
<div class="card">
  <h1 id="title"></h1>
  <p class="meta" id="meta"></p>
  <div id="about"></div>
  <div class="src" id="src"></div>
</div>
<script src="score.js"></script>
<script>
{
  // The two films (Nov 13, Christian: "the 2 most iconic" free films). Each is a public domain silent film, kept as a plain
  // H.264 file. The host takes no video file types, so the bytes ship under a .wasm name and are handed to the <video>
  // element as a blob, which the artifact's content policy allows. Nothing is fetched from any other site.
  const FILMS = {
    trip: { title: 'A Trip to the Moon', orig: 'Le Voyage dans la Lune', year: 1902, by: 'Georges Méliès, Star Film, Paris', house: 'Theater 1',
      file: 'films/trip.wasm', size: 16505561,
      about: ['A club of astronomers hears its president propose a journey to the Moon. Workers build a capsule, a giant cannon fires it, and it lands right in the eye of the Man in the Moon.',
        'The explorers sleep under the stars, find a cave of giant mushrooms, meet the Moon\'s inhabitants, are taken before their king, and escape. The capsule tips off a cliff, falls back to Earth, sinks into the sea and is towed home to a parade.',
        'Méliès was a stage magician before he made films. He built the sets, played the professor himself, and made the tricks with stops, substitutions and painted scenery. The story borrows from Jules Verne\'s novels From the Earth to the Moon and Around the Moon.'],
      src: '<b>This copy:</b> <a href="https://commons.wikimedia.org/wiki/File:Le_Voyage_dans_la_Lune_(1902).webm" target="_blank" rel="noopener">Le Voyage dans la Lune (1902).webm</a> on Wikimedia Commons, a black-and-white print, scaled down and with its film grain softened for the game.<br><b>Public domain:</b> released in 1902; Georges Méliès died in 1938, so the film is out of copyright in France, the United States and most of the world.' },
    gtr: { title: 'The Great Train Robbery', orig: '', year: 1903, by: 'Edwin S. Porter, Edison Manufacturing Company', house: 'Theater 2',
      file: 'films/gtr.wasm', size: 9726943,
      about: ['Bandits hold up a railroad telegraph office, slip aboard a train at a water tower, rob the express car and then the passengers, and get away on the uncoupled engine. They reach their horses and ride into the woods.',
        'The telegraph operator\'s little girl finds him tied up. Word reaches a dance hall, a posse rides out, and the chase ends in a shoot-out in the trees. In the last shot, which exhibitors could show first or last, a bandit aims straight at the audience and fires.',
        'Made in New Jersey and about twelve minutes long, it was one of the first films to tell a story across many places and shots, and it helped make the western a genre. It is in the U.S. National Film Registry.'],
      src: '<b>This copy:</b> <a href="https://archive.org/details/TheGreatTrainRobbery1903_201307" target="_blank" rel="noopener">The Great Train Robbery (1903)</a> on the Internet Archive, posted by The Public Domain Review, with its original 1903 title card.<br><b>Public domain:</b> published in the United States in 1903, so its copyright has long expired; Edwin S. Porter died in 1941.' },
  };
  const q = new URLSearchParams(location.search), id = FILMS[q.get('f')] ? q.get('f') : 'trip', F0 = FILMS[id];
  const $ = s => document.getElementById(s), v = $('v');
  document.title = F0.title + ' (' + F0.year + ') · Palace ' + F0.house;
  $('title').textContent = F0.title.toUpperCase();
  $('meta').textContent = (F0.orig ? F0.orig + ' · ' : '') + F0.year + ' · ' + F0.by + ' · silent, black and white · now showing in ' + F0.house;
  $('about').innerHTML = F0.about.map(p => '<p>' + p + '</p>').join('');
  $('src').innerHTML = F0.src + '<br><b>Music:</b> piano accompaniment in the silent-film manner, played by your browser and timed to the scenes. Theaters of the day chose their own music, and no score came with this film. The tunes are written for the game in the style of the period, with two themes from the public domain: Grieg\'s <i>In the Hall of the Mountain King</i> (1875) and Brahms\'s <i>Lullaby</i> (1868).';
  $('stitle').textContent = F0.title.toUpperCase(); $('syear').textContent = F0.year + ' · ' + F0.by.split(',')[0];
  const fmt = s => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const show = (k) => { for (const e of ['load', 'start', 'end', 'err']) $(e).hidden = e !== k; };
  const fail = (m) => { $('errmsg').innerHTML = m + ' You can watch it at its source instead: ' + F0.src.match(/<a [^>]+>[^<]+<\/a>/)[0] + '.'; show('err'); };

  // ---- load the reel with a progress meter, then hand it to the video element as a blob ----
  (async () => {
    try {
      const r = await fetch(F0.file); if (!r.ok) throw new Error('HTTP ' + r.status);
      const total = +r.headers.get('content-length') || F0.size || 0, rd = r.body && r.body.getReader ? r.body.getReader() : null, parts = []; let got = 0;
      if (rd) { for (;;) { const { done, value } = await rd.read(); if (done) break; parts.push(value); got += value.length;
          if (total) { const p = Math.min(100, Math.round(got / total * 100)); $('meter').style.width = p + '%'; $('pct').textContent = p + '%'; } } }
      else { parts.push(new Uint8Array(await r.arrayBuffer())); }
      const url = URL.createObjectURL(new Blob(parts, { type: 'video/mp4' }));
      v.src = url;
      v.addEventListener('loadedmetadata', () => { $('time').textContent = '0:00 / ' + fmt(v.duration); show('start'); try { $('go').focus(); } catch (e) {} }, { once: true });
      v.addEventListener('error', () => fail('This browser could not play the film here.'), { once: true });
    } catch (e) { fail('The reel did not load (' + (e && e.message || e) + ').'); }
  })();

  // ---- the projector's clatter, made on the spot (Web Audio), off until asked for ----
  let AC = null, SRC = null, GN = null, sound = false;
  function clatter() {
    if (!AC) { AC = new (window.AudioContext || window.webkitAudioContext)(); GN = AC.createGain(); GN.gain.value = 0.16; GN.connect(AC.destination); }
    const sr = AC.sampleRate, n = sr * 2, b = AC.createBuffer(1, n, sr), d = b.getChannelData(0); let lp = 0, lp2 = 0;
    for (let i = 0; i < n; i++) { const w = Math.random() * 2 - 1; lp += (w - lp) * 0.03; lp2 += (lp - lp2) * 0.08; let x = lp2 * 1.8;
      const ph = (i / sr * 18) % 1; if (ph < 0.02) x += (Math.random() * 2 - 1) * 0.35 * (1 - ph / 0.02); d[i] = x; }
    return b;
  }
  function soundSync() {
    const want = sound && !v.paused && !v.ended;
    if (want && !SRC) { try { const b = clatter(); if (AC.state === 'suspended') AC.resume(); SRC = AC.createBufferSource(); SRC.buffer = b; SRC.loop = true; SRC.connect(GN); SRC.start(); } catch (e) {} }
    if (!want && SRC) { try { SRC.stop(); } catch (e) {} SRC = null; }
  }
  $('snd').onclick = () => { sound = !sound; $('snd').textContent = 'Projector sound: ' + (sound ? 'on' : 'off'); $('snd').setAttribute('aria-pressed', sound); soundSync(); };

  // ---- the piano: a silent-film accompaniment made on the spot (Web Audio) from score.js, timed to the scenes; on by default.
  // No film of this age came with a fixed score: each theater's pianist played what fit. Cue times come from the cuts in these copies.
  const SC = window.PALACE_SCORE || null, CUES = SC ? (SC.cues[id] || []) : [];
  let music = !!SC, MG = null, mcur = 0; const live = new Set();
  if (!SC) { $('mus').hidden = true; }
  function mctx() {
    if (!AC) { AC = new (window.AudioContext || window.webkitAudioContext)(); GN = AC.createGain(); GN.gain.value = 0.16; GN.connect(AC.destination); }
    if (!MG) { MG = AC.createGain(); MG.gain.value = 0.22; const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3600;
      const cp = AC.createDynamicsCompressor(); cp.threshold.value = -16; cp.ratio.value = 5; MG.connect(lp); lp.connect(cp); cp.connect(AC.destination); }
    return AC;
  }
  function key(t0, m, dur, vel) {      // one upright-piano note: two slightly detuned strings and an octave partial, struck and decaying
    const f = 440 * Math.pow(2, (m - 69) / 12), g = AC.createGain(), g2 = AC.createGain();
    const o1 = AC.createOscillator(), o2 = AC.createOscillator(), o3 = AC.createOscillator();
    o1.type = 'triangle'; o2.type = 'triangle'; o3.type = 'sine';
    o1.frequency.value = f; o2.frequency.value = f * 1.0032; o3.frequency.value = f * 2; g2.gain.value = 0.22;
    o1.connect(g); o2.connect(g); o3.connect(g2); g2.connect(g); g.connect(MG);
    const a = Math.max(t0, AC.currentTime), te = a + Math.max(0.09, dur), v0 = vel * 0.32;
    g.gain.setValueAtTime(0, a); g.gain.linearRampToValueAtTime(v0, a + 0.006);
    g.gain.setTargetAtTime(v0 * 0.3, a + 0.006, 0.2 + 28 / f); g.gain.setTargetAtTime(0, te, 0.07);
    const n = { g, os: [o1, o2, o3] };
    for (const o of n.os) { o.start(a); o.stop(te + 0.45); }
    o1.onended = () => live.delete(n); live.add(n);
  }
  function sched(a, b, now) {          // schedule every note whose film time falls in [a, b)
    const base = AC.currentTime - now;
    for (let i = 0; i < CUES.length; i++) {
      const t = CUES[i][0], p = CUES[i][1], o = CUES[i][2] || {}, e = i + 1 < CUES.length ? CUES[i + 1][0] : 1e9;
      if (p === 'end' || e <= a || t >= b) continue;
      if (p[0] === '!') { if (t >= a && t < b) for (const h of SC.hits[p.slice(1)]) for (const m of h[2]) key(base + t + h[0], m, h[1], 0.5); continue; }
      const P = SC.pieces[p], spb = 60 / (o.bpm || P.bpm), L = P.beats * spb, tr = o.tr || 0;
      const k0 = Math.max(0, Math.floor((a - t) / L)), k1 = p === 'fanfare' ? 0 : Math.floor((Math.min(b, e) - t) / L);
      for (let k = k0; k <= k1; k++) {
        const s0 = t + k * L;
        [P.rh, P.lh].forEach((vc, vi) => { for (const n of vc) {
          const nt = s0 + n[0] * spb; if (nt < a || nt >= b || nt >= e) continue;
          const d = Math.min(n[1] * spb, e - nt) * 0.95; for (const m of n[2]) key(base + nt, m + tr, d, P.v[vi]);
        } });
      }
    }
  }
  function hush() { if (!AC) return; for (const n of live) { try { n.g.gain.cancelScheduledValues(AC.currentTime); n.g.gain.setTargetAtTime(0, AC.currentTime, 0.03); for (const o of n.os) o.stop(AC.currentTime + 0.25); } catch (e) {} } live.clear(); }
  setInterval(() => {
    if (!music || !SC || v.paused || v.ended || v.seeking || !v.duration) return;
    mctx(); if (AC.state === 'suspended') { AC.resume(); return; }
    const now = v.currentTime; if (mcur < now - 0.25 || mcur > now + 1.5) mcur = now;
    const tgt = now + 0.4; if (tgt > mcur) { sched(mcur, tgt, now); mcur = tgt; }
  }, 80);
  v.addEventListener('seeking', () => { hush(); mcur = v.currentTime; });
  v.addEventListener('pause', () => { hush(); mcur = v.currentTime; });
  v.addEventListener('play', () => { mcur = v.currentTime; });
  for (const b of ['go', 'again', 'pp']) $(b).addEventListener('click', () => { if (music && SC) { mctx(); if (AC.state === 'suspended') AC.resume(); } });
  $('mus').onclick = () => { music = !music; $('mus').textContent = 'Music: ' + (music ? 'on' : 'off'); $('mus').setAttribute('aria-pressed', music);
    if (!music) hush(); else { mctx(); if (AC.state === 'suspended') AC.resume(); mcur = v.currentTime; } };

  // ---- playing ----
  const play = () => { const p = v.play(); if (p && p.catch) p.catch(() => {}); };
  $('go').onclick = () => { show(null); play(); };
  $('again').onclick = () => { v.currentTime = 0; show(null); play(); };
  const back = () => { try { parent.arcadeClose(); } catch (e) { history.back(); } };
  $('lobby').onclick = back;
  $('pp').onclick = () => { if (!$('start').hidden) $('go').click(); else if (v.paused) play(); else v.pause(); };
  v.addEventListener('play', () => { $('pp').textContent = '❚❚'; $('pp').setAttribute('aria-label', 'Pause'); soundSync(); });
  v.addEventListener('pause', () => { $('pp').textContent = '▶'; $('pp').setAttribute('aria-label', 'Play'); soundSync(); });
  v.addEventListener('ended', () => { show('end'); soundSync(); try { $('again').focus(); } catch (e) {} });
  let dragging = false;
  v.addEventListener('timeupdate', () => { if (!v.duration) return; $('time').textContent = fmt(v.currentTime) + ' / ' + fmt(v.duration); if (!dragging) $('seek').value = Math.round(v.currentTime / v.duration * 1000); });
  $('seek').addEventListener('input', () => { dragging = true; if (v.duration) v.currentTime = $('seek').value / 1000 * v.duration; });
  $('seek').addEventListener('change', () => { dragging = false; });
  v.addEventListener('click', () => $('pp').click());
  $('fs').onclick = () => { const el = $('screen'); try { if (document.fullscreenElement) document.exitFullscreen(); else (el.requestFullscreen || el.webkitRequestFullscreen).call(el).catch(() => {}); } catch (e) {} };
  addEventListener('keydown', e => {
    if (e.key === 'Escape') { if (document.fullscreenElement) return; e.preventDefault(); back(); return; }
    if (e.target && e.target.tagName === 'INPUT') return;
    if (e.key === ' ' || e.key === 'k' || e.key === 'K') { e.preventDefault(); $('pp').click(); }
    else if (e.key === 'ArrowRight') { v.currentTime = Math.min(v.duration || 0, v.currentTime + 10); }
    else if (e.key === 'ArrowLeft') { v.currentTime = Math.max(0, v.currentTime - 10); }
    else if (e.key === 'f' || e.key === 'F') $('fs').click();
  });
}
</script>
</body></html>
